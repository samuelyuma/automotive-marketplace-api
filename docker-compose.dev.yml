name: automotive-marketplace

services:
  api:
    container_name: automotive-marketplace-api
    build:
      context: .
      target: development
    init: true
    env_file:
      - .env
    environment:
      NODE_ENV: production
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
    volumes:
      - ./src:/app/src:ro
      - ./migrations:/app/migrations:ro
    ports:
      - "127.0.0.1:${PORT:-8080}:${PORT:-8080}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "const r = await fetch('http://127.0.0.1:' + (process.env.PORT ?? 8080) + '/health-check'); if (!r.ok) process.exit(1);"
      interval: 5s
      timeout: 5s
      start_period: 15s
      retries: 5
    networks:
      - app

  postgres:
    container_name: automotive-marketplace-postgres
    image: postgres:18
    env_file:
      - .env
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - 'PGPASSWORD="$$POSTGRES_PASSWORD" psql -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -Atc "SELECT 1" >/dev/null'
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 20
    networks:
      - app

  redis:
    container_name: automotive-marketplace-redis
    image: redis:8
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 10
    networks:
      - app

volumes:
  postgres_data:
    name: automotive-marketplace-postgres-data
  redis_data:
    name: automotive-marketplace-redis-data

networks:
  app:
    name: automotive-marketplace-network
